# Daily pipeline: find new menu posts, read them with Gemini, write meals to Supabase.
# All state lives in Supabase, so each run starts from an empty runner and picks up
# where the previous one stopped (e.g. when the free Gemini quota ran out).
name: Daily pipeline

on:
  schedule:
    - cron: "0 22 * * *"  # 05:00 Vietnam time (UTC+7); GitHub may start it a little late
  workflow_dispatch:
    inputs:
      scope:
        description: "Which schools to crawl"
        type: choice
        options: [tracked, active-only, all-regular-and-active]
        default: tracked

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Python version from .python-version, exact packages from uv.lock.
      - run: uv sync --locked

      - name: Crawl new menu posts
        run: |
          # Scheduled runs have no inputs: default to the tracked list.
          case "${{ inputs.scope }}" in
            all-regular-and-active) uv run python -m pipeline.crawl --since-days 10 ;;
            active-only) uv run python -m pipeline.crawl --since-days 10 --active-only ;;
            *) uv run python -m pipeline.crawl --since-days 10 --tracked ;;
          esac

      - name: Read menus with Gemini
        run: uv run python -m pipeline.process

      - name: Nutrition estimates and allergens
        run: uv run python -m pipeline.nutrition
